<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crear cuenta — NexoAcadémico</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/global.css" />
<link rel="stylesheet" href="css/auth.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/dark-mode.css" />
</head>
<body class="auth-body">
<div class="auth-card">
  <img src="assets/logo.svg" alt="Logo" class="auth-logo" />
  <h1>Crear cuenta</h1>
  <p class="auth-subtitle">Regístrate con tu correo. Te enviaremos un código de acceso, sin contraseñas.</p>

  <form id="request-code-form">
    <label for="email-input">Correo electrónico</label>
    <input id="email-input" type="email" required placeholder="tucorreo@ejemplo.com" />
    <p id="auth-error" class="auth-error"></p>
    <button type="submit" class="btn btn-primary btn-block">Enviar código</button>
  </form>

  <p class="auth-footer">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
  <p class="auth-footer"><a href="index.html">← Volver al inicio</a></p>
</div>
<script>
  if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
