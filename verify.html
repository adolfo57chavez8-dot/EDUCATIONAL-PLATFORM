<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verificar código — NexoAcadémico</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/global.css" />
<link rel="stylesheet" href="css/auth.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/dark-mode.css" />
</head>
<body class="auth-body">
<div class="auth-card">
  <img src="assets/logo.svg" alt="Logo" class="auth-logo" />
  <h1>Verifica tu código</h1>
  <p class="auth-subtitle">Enviamos un código de 6 dígitos a <strong id="pending-email-label"></strong></p>

  <form id="verify-code-form">
    <label for="code-input">Código de acceso</label>
    <input id="code-input" type="text" inputmode="numeric" maxlength="6" required placeholder="123456" />
    <p id="auth-error" class="auth-error"></p>
    <button type="submit" class="btn btn-primary btn-block">Verificar código</button>
  </form>

  <button id="resend-code-btn" class="btn btn-link">Reenviar código</button>
  <p class="auth-footer"><a href="login.html">← Volver</a></p>
</div>
<script>
  if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
