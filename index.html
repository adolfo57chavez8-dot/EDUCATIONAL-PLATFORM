<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexoAcadémico — Plataforma de estudio</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/global.css" />
<link rel="stylesheet" href="css/auth.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/dark-mode.css" />
</head>
<body>
<div class="landing">
  <div class="landing-hero">
    <img src="assets/logo.svg" alt="Logo" class="landing-logo" />
    <h1>NexoAcadémico</h1>
    <p>Tu material de estudio, organizado por ciclos, materias y unidades — en un solo lugar.</p>
    <div class="landing-actions">
      <a href="login.html" class="btn btn-primary">Iniciar sesión</a>
      <a href="register.html" class="btn btn-secondary">Crear cuenta</a>
    </div>
  </div>
</div>
<script>
  if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script>
  (async () => {
    const { data: { session } } = await window.supabaseClient.auth.getSession();
    if (session) window.location.href = "dashboard.html";
  })();
</script>
</body>
</html>
